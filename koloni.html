<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karınca Çiftliğim - Koloni Takip</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    color: #222;
    min-height: 100vh;
}

.container {
    width: 100%;
    max-width: 600px;
    margin: auto;
    padding: 20px;
}

.card {
    background: white;
    border-radius: 20px;
    padding: 25px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    margin-bottom: 15px;
}

h1, h2, h3 {
    margin-top: 0;
}

.subtitle {
    color: #777;
    font-size: 14px;
}

input,
textarea {
    width: 100%;
    padding: 13px;
    border: 1px solid #ddd;
    border-radius: 12px;
    font-size: 15px;
    margin-top: 6px;
}

textarea {
    min-height: 90px;
    resize: vertical;
}

label {
    font-size: 13px;
    font-weight: bold;
}

.form-group {
    margin-bottom: 14px;
}

button {
    border: none;
    border-radius: 13px;
    padding: 13px 17px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

.primary {
    width: 100%;
    background: #222;
    color: white;
}

.secondary {
    background: #eee;
    color: #222;
}

.danger {
    background: #f4dddd;
    color: #8b2222;
}

.hidden {
    display: none !important;
}

.center {
    text-align: center;
}

.auth-switch {
    text-align: center;
    margin-top: 15px;
    font-size: 13px;
    color: #777;
}

.auth-switch button {
    background: none;
    padding: 0;
    text-decoration: underline;
}

.colony {
    background: white;
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 12px;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(0,0,0,0.06);
}

.colony:hover {
    transform: translateY(-2px);
}

.colony-name {
    font-size: 20px;
    font-weight: bold;
}

.colony-species {
    color: #777;
    font-size: 13px;
    margin-top: 5px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 7px;
    margin-top: 15px;
}

.stat {
    background: #f4f4f4;
    border-radius: 11px;
    padding: 10px 4px;
    text-align: center;
}

.stat-number {
    font-size: 18px;
    font-weight: bold;
}

.stat-label {
    font-size: 10px;
    color: #777;
}

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.detail-title {
    font-size: 25px;
    font-weight: bold;
}

.detail-species {
    color: #777;
    margin-top: 5px;
}

.big-stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 9px;
    margin: 18px 0;
}

.big-stat {
    background: #f4f4f4;
    border-radius: 14px;
    padding: 15px;
}

.big-stat-number {
    font-size: 24px;
    font-weight: bold;
}

.big-stat-label {
    color: #777;
    font-size: 12px;
}

.action-button {
    width: 100%;
    margin-top: 8px;
}

.history-item {
    border-bottom: 1px solid #eee;
    padding: 15px 0;
}

.history-item:last-child {
    border-bottom: none;
}

.history-date {
    font-weight: bold;
}

.history-stats {
    color: #777;
    font-size: 13px;
    margin-top: 5px;
}

.history-note {
    margin-top: 7px;
    font-size: 14px;
    line-height: 1.4;
}

.photo-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 7px;
    margin-top: 10px;
}

.photo-grid img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    border-radius: 10px;
}

.share-box {
    background: #f4f4f4;
    border-radius: 13px;
    padding: 12px;
    margin-top: 10px;
    font-size: 12px;
    word-break: break-all;
}

.share-box button {
    width: 100%;
    margin-top: 8px;
}

.notice {
    background: #fff8df;
    border-radius: 12px;
    padding: 12px;
    font-size: 13px;
    margin-bottom: 15px;
}

.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 15px;
    z-index: 10;
}

.modal.open {
    display: flex;
}

.modal-content {
    background: white;
    border-radius: 20px;
    padding: 22px;
    width: 100%;
    max-width: 550px;
    max-height: 92vh;
    overflow-y: auto;
}

.close {
    float: right;
    border-radius: 50%;
    width: 35px;
    height: 35px;
    padding: 0;
    background: #eee;
    font-size: 20px;
}

.preview {
    display: flex;
    gap: 7px;
    overflow-x: auto;
    margin-top: 8px;
}

.preview img {
    width: 70px;
    height: 70px;
    object-fit: cover;
    border-radius: 9px;
}

.empty {
    text-align: center;
    color: #777;
    padding: 35px 10px;
}

canvas {
    width: 100%;
    height: 230px;
    background: #fafafa;
    border-radius: 13px;
}

@media (max-width: 450px) {
    .stats {
        grid-template-columns: repeat(2, 1fr);
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- GİRİŞ -->
    <div id="authView">

        <div class="card">

            <div class="center">

                <h1>🐜 Karınca Çiftliğim</h1>

                <p id="authDescription" class="subtitle">
                    Koloni takip sistemine giriş yap.
                </p>

            </div>

            <form id="authForm">

                <div class="form-group">

                    <label>E-posta</label>

                    <input
                        id="email"
                        type="email"
                        required
                    >

                </div>

                <div class="form-group">

                    <label>Şifre</label>

                    <input
                        id="password"
                        type="password"
                        minlength="6"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="primary"
                    id="authButton"
                >
                    Giriş Yap
                </button>

            </form>

            <div class="auth-switch">

                <span id="authSwitchText">
                    Hesabın yok mu?
                </span>

                <button id="authSwitchButton">
                    Kayıt Ol
                </button>

            </div>

            <p id="authMessage"></p>

        </div>

    </div>


    <!-- KOLONİ LİSTESİ -->
    <div id="listView" class="hidden">

        <div class="topbar">

            <span id="userEmail"></span>

            <button
                class="secondary"
                id="logoutButton"
            >
                Çıkış
            </button>

        </div>

        <button
            class="primary"
            id="newColonyButton"
        >
            ＋ Yeni Koloni
        </button>

        <div style="height:15px"></div>

        <div id="colonyList"></div>

    </div>


    <!-- KOLONİ DETAY -->
    <div id="detailView" class="hidden">

        <div class="card">

            <div class="topbar">

                <div>

                    <div
                        id="detailName"
                        class="detail-title"
                    ></div>

                    <div
                        id="detailSpecies"
                        class="detail-species"
                    ></div>

                </div>

                <button
                    class="secondary"
                    id="backButton"
                >
                    ← Geri
                </button>

            </div>


            <div
                id="currentStats"
                class="big-stats"
            ></div>


            <button
                class="primary action-button"
                id="updateButton"
            >
                ＋ Güncelleme Ekle
            </button>

            <button
                class="secondary action-button"
                id="shareButton"
            >
                🔗 Günlüğü Paylaş
            </button>

            <div
                id="shareBox"
                class="share-box hidden"
            ></div>

            <button
                class="danger action-button"
                id="deleteButton"
            >
                Koloniyi Sil
            </button>

        </div>


        <div class="card">

            <h3>📈 İşçi Gelişimi</h3>

            <canvas id="chart"></canvas>

        </div>


        <div class="card">

            <h3>📅 Koloni Geçmişi</h3>

            <div id="history"></div>

        </div>

    </div>


    <!-- PAYLAŞILAN KOLONİ -->
    <div id="sharedView" class="hidden">

        <div class="card">

            <div class="detail-title">
                <span id="sharedName"></span>
            </div>

            <div
                id="sharedSpecies"
                class="detail-species"
            ></div>

            <div
                id="sharedStats"
                class="big-stats"
            ></div>

            <div class="notice">

                👀 Bu koloni günlüğü
                <b>salt okunurdur.</b>

                <br>

                Yalnızca koloni sahibi
                güncelleme yapabilir.

            </div>

        </div>


        <div class="card">

            <h3>📈 İşçi Gelişimi</h3>

            <canvas id="sharedChart"></canvas>

        </div>


        <div class="card">

            <h3>📅 Koloni Geçmişi</h3>

            <div id="sharedHistory"></div>

        </div>

    </div>

</div>


<!-- MODAL -->

<div
    id="modal"
    class="modal"
>

    <div class="modal-content">

        <button
            class="close"
            id="closeModal"
        >
            ×
        </button>

        <h2 id="modalTitle">
            Yeni Koloni
        </h2>


        <form id="colonyForm">

            <div
                id="colonyNameGroup"
                class="form-group"
            >

                <label>Koloni adı</label>

                <input
                    id="colonyName"
                    placeholder="Örn. Messor #1"
                >

            </div>


            <div
                id="speciesGroup"
                class="form-group"
            >

                <label>Cins / Tür</label>

                <input
                    id="species"
                    placeholder="Örn. Messor structor"
                >

            </div>


            <div
                id="foundingGroup"
                class="form-group"
            >

                <label>Kuruluş tarihi</label>

                <input
                    id="foundingDate"
                    type="date"
                >

            </div>


            <div class="form-group">

                <label>İşçi sayısı</label>

                <input
                    id="workers"
                    type="number"
                    min="0"
                    value="0"
                    required
                >

            </div>


            <div class="form-group">

                <label>Yumurta sayısı</label>

                <input
                    id="eggs"
                    type="number"
                    min="0"
                    value="0"
                >

            </div>


            <div class="form-group">

                <label>Larva sayısı</label>

                <input
                    id="larvae"
                    type="number"
                    min="0"
                    value="0"
                >

            </div>


            <div class="form-group">

                <label>Pupa sayısı</label>

                <input
                    id="pupae"
                    type="number"
                    min="0"
                    value="0"
                >

            </div>


            <div class="form-group">

                <label>Sıcaklık °C</label>

                <input
                    id="temperature"
                    type="number"
                    step="0.1"
                    placeholder="25"
                >

            </div>


            <div class="form-group">

                <label>Nem %</label>

                <input
                    id="humidity"
                    type="number"
                    min="0"
                    max="100"
                    placeholder="70"
                >

            </div>


            <div class="form-group">

                <label>Not</label>

                <textarea
                    id="note"
                    placeholder="Bugünkü gözlemlerin..."
                ></textarea>

            </div>


            <div class="form-group">

                <label>📷 Fotoğraf ekle</label>

                <input
                    id="photos"
                    type="file"
                    accept="image/*"
                    multiple
                >

                <div
                    id="preview"
                    class="preview"
                ></div>

            </div>


            <button
                class="primary"
                type="submit"
            >
                Kaydet
            </button>

        </form>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =====================================
   SUPABASE
===================================== */

const SUPABASE_URL =
"https://vxyradcmcnkecjlfqegq.supabase.co";

const SUPABASE_KEY =
"sb_publishable_37XPeyOYG-ZoDu0AJPlhGg_JbWdEG41";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================
   DEĞİŞKENLER
===================================== */

let currentUser = null;

let currentColony = null;

let authMode = "login";

let selectedPhotos = [];


/* =====================================
   YARDIMCI
===================================== */

function show(id) {

    document
        .getElementById(id)
        .classList
        .remove("hidden");

}


function hide(id) {

    document
        .getElementById(id)
        .classList
        .add("hidden");

}


function resetViews() {

    hide("authView");
    hide("listView");
    hide("detailView");
    hide("sharedView");

}


function today() {

    const d = new Date();

    const month =
        String(d.getMonth() + 1)
        .padStart(2, "0");

    const day =
        String(d.getDate())
        .padStart(2, "0");

    return (
        d.getFullYear()
        + "-"
        + month
        + "-"
        + day
    );

}


function formatDate(date) {

    if (!date) return "—";

    const parts =
        date.split("-");

    return (
        parts[2]
        + "."
        + parts[1]
        + "."
        + parts[0]
    );

}


function escapeHTML(text) {

    return String(text ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* =====================================
   AUTH
===================================== */

async function checkSession() {

    const {
        data,
        error
    } =
    await supabaseClient
        .auth
        .getSession();


    if (
        data &&
        data.session
    ) {

        currentUser =
            data.session.user;

        showColonies();

    }

    else {

        resetViews();

        show("authView");

    }

}


document
    .getElementById("authForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("password")
                    .value;


            const message =
                document
                    .getElementById("authMessage");


            message.textContent =
                "İşlem yapılıyor...";


            let result;


            if (authMode === "login") {

                result =
                    await supabaseClient
                        .auth
                        .signInWithPassword({
                            email,
                            password
                        });

            }

            else {

                result =
                    await supabaseClient
                        .auth
                        .signUp({
                            email,
                            password
                        });

            }


            if (result.error) {

                message.textContent =
                    result.error.message;

                return;

            }


            if (
                authMode === "signup"
                &&
                !result.data.session
            ) {

                message.textContent =
                    "Kayıt başarılı. E-posta doğrulaması gerekiyorsa e-postanı kontrol et.";

                return;

            }


            currentUser =
                result.data.user;

            showColonies();

        }
    );


document
    .getElementById("authSwitchButton")
    .addEventListener(
        "click",
        function() {

            if (authMode === "login") {

                authMode = "signup";

                document
                    .getElementById(
                        "authDescription"
                    )
                    .textContent =
                    "Kolonilerini kaydetmek için hesap oluştur.";

                document
                    .getElementById(
                        "authButton"
                    )
                    .textContent =
                    "Kayıt Ol";

                document
                    .getElementById(
                        "authSwitchText"
                    )
                    .textContent =
                    "Zaten hesabın var mı?";

                document
                    .getElementById(
                        "authSwitchButton"
                    )
                    .textContent =
                    "Giriş Yap";

            }

            else {

                authMode = "login";

                document
                    .getElementById(
                        "authDescription"
                    )
                    .textContent =
                    "Koloni takip sistemine giriş yap.";

                document
                    .getElementById(
                        "authButton"
                    )
                    .textContent =
                    "Giriş Yap";

                document
                    .getElementById(
                        "authSwitchText"
                    )
                    .textContent =
                    "Hesabın yok mu?";

                document
                    .getElementById(
                        "authSwitchButton"
                    )
                    .textContent =
                    "Kayıt Ol";

            }

        }
    );


document
    .getElementById("logoutButton")
    .addEventListener(
        "click",
        async function() {

            await supabaseClient
                .auth
                .signOut();

            currentUser = null;

            resetViews();

            show("authView");

        }
    );


/* =====================================
   KOLONİ LİSTESİ
===================================== */

async function showColonies() {

    resetViews();

    show("listView");

    document
        .getElementById("userEmail")
        .textContent =
        currentUser.email;


    await loadColonies();

}


async function loadColonies() {

    const {
        data,
        error
    } =
    await supabaseClient
        .from("colonies")
        .select("*")
        .eq(
            "owner_id",
            currentUser.id
        )
        .order(
            "created_at",
            {
                ascending: false
            }
        );


    if (error) {

        alert(error.message);

        return;

    }


    const list =
        document
            .getElementById(
                "colonyList"
            );


    if (!data || data.length === 0) {

        list.innerHTML = `
            <div class="card empty">

                Henüz bir kolonin yok.

                <br><br>

                İlk kolonini oluşturmak için
                yukarıdaki butona bas.

            </div>
        `;

        return;

    }


    list.innerHTML = "";


    for (const colony of data) {

        const {
            data: updates
        } =
        await supabaseClient
            .from("colony_updates")
            .select("*")
            .eq(
                "colony_id",
                colony.id
            )
            .order(
                "update_date",
                {
                    ascending: false
                }
            )
            .limit(1);


        const last =
            updates &&
            updates.length
                ? updates[0]
                : {
                    workers: 0,
                    eggs: 0,
                    larvae: 0,
                    pupae: 0
                };


        const element =
            document.createElement(
                "div"
            );


        element.className =
            "colony";


        element.innerHTML = `

            <div class="colony-name">

                🐜
                ${escapeHTML(
                    colony.name
                )}

            </div>

            <div class="colony-species">

                ${escapeHTML(
                    colony.species
                    || "Tür belirtilmedi"
                )}

            </div>


            <div class="stats">

                <div class="stat">

                    <div class="stat-number">
                        ${last.workers || 0}
                    </div>

                    <div class="stat-label">
                        İşçi
                    </div>

                </div>


                <div class="stat">

                    <div class="stat-number">
                        ${last.eggs || 0}
                    </div>

                    <div class="stat-label">
                        Yumurta
                    </div>

                </div>


                <div class="stat">

                    <div class="stat-number">
                        ${last.larvae || 0}
                    </div>

                    <div class="stat-label">
                        Larva
                    </div>

                </div>


                <div class="stat">

                    <div class="stat-number">
                        ${last.pupae || 0}
                    </div>

                    <div class="stat-label">
                        Pupa
                    </div>

                </div>

            </div>

        `;


        element.addEventListener(
            "click",
            function() {

                openColony(
                    colony.id
                );

            }
        );


        list.appendChild(element);

    }

}


/* =====================================
   KOLONİ AÇ
===================================== */

async function openColony(id) {

    const {
        data,
        error
    } =
    await supabaseClient
        .from("colonies")
        .select("*")
        .eq("id", id)
        .single();


    if (error) {

        alert(error.message);

        return;

    }


    currentColony = data;


    resetViews();

    show("detailView");


    document
        .getElementById(
            "shareBox"
        )
        .classList
        .add("hidden");


    await renderColony();

}


/* =====================================
   KOLONİ DETAY
===================================== */

async function renderColony() {

    const colony =
        currentColony;


    document
        .getElementById(
            "detailName"
        )
        .textContent =
        "🐜 " + colony.name;


    document
        .getElementById(
            "detailSpecies"
        )
        .textContent =
        colony.species
        || "Tür belirtilmedi";


    const {
        data: updates,
        error
    } =
    await supabaseClient
        .from("colony_updates")
        .select("*")
        .eq(
            "colony_id",
            colony.id
        )
        .order(
            "update_date",
            {
                ascending: true
            }
        )
        .order(
            "created_at",
            {
                ascending: true
            }
        );


    if (error) {

        alert(error.message);

        return;

    }


    const history =
        updates || [];


    const last =
        history.length
            ? history[
                history.length - 1
            ]
            : {
                workers: 0,
                eggs: 0,
                larvae: 0,
                pupae: 0,
                temperature: null,
                humidity: null
            };


    document
        .getElementById(
            "currentStats"
        )
        .innerHTML = `

        <div class="big-stat">

            <div class="big-stat-number">
                ${last.workers || 0}
            </div>

            <div class="big-stat-label">
                👷 İşçi
            </div>

        </div>


        <div class="big-stat">

            <div class="big-stat-number">
                ${last.eggs || 0}
            </div>

            <div class="big-stat-label">
                🥚 Yumurta
            </div>

        </div>


        <div class="big-stat">

            <div class="big-stat-number">
                ${last.larvae || 0}
            </div>

            <div class="big-stat-label">
                🐛 Larva
            </div>

        </div>


        <div class="big-stat">

            <div class="big-stat-number">
                ${last.pupae || 0}
            </div>

            <div class="big-stat-label">
                🟤 Pupa
            </div>

        </div>


        <div class="big-stat">

            <div class="big-stat-number">
                ${
                    last.temperature != null
                    ? last.temperature + "°C"
                    : "—"
                }

async function renderHistory(history) {

    const container =
        document.getElementById("history");

    if (!history || !history.length) {

        container.innerHTML = `
            <div class="empty">
                Henüz güncelleme yok.
            </div>
        `;

        return;
    }

    container.innerHTML = "";

    for (const record of [...history].reverse()) {

        const item =
            document.createElement("div");

        item.className = "history-item";

        /*
         * FOTOĞRAFLARI ÇEK
         */

        let photos = [];

        const photoResult =
            await supabaseClient
                .from("colony_photos")
                .select("*")
                .eq("update_id", record.id);

        console.log(
            "FOTOĞRAF SORGUSU:",
            record.id,
            photoResult
        );

        if (photoResult.error) {

            console.error(
                "FOTOĞRAF SORGULAMA HATASI:",
                photoResult.error
            );

        } else {

            photos =
                photoResult.data || [];

        }

        /*
         * FOTOĞRAF HTML
         */

        let photoHTML = "";

        if (photos.length > 0) {

            photoHTML = `
                <div class="photo-grid">
                    ${photos.map(photo => {

                        if (!photo.photo_url) {
                            return "";
                        }

                        return `
                            <a
                                href="${escapeHTML(photo.photo_url)}"
                                target="_blank"
                                rel="noopener"
                                style="display:block;"
                            >
                                <img
                                    src="${escapeHTML(photo.photo_url)}"
                                    alt="Koloni fotoğrafı"
                                    loading="lazy"
                                    style="
                                        display:block;
                                        width:100%;
                                        aspect-ratio:1;
                                        object-fit:cover;
                                        border-radius:10px;
                                    "
                                    onerror="
                                        console.error(
                                            'FOTOĞRAF AÇILAMADI:',
                                            this.src
                                        );
                                    "
                                >
                            </a>
                        `;

                    }).join("")}
                </div>
            `;

        }

        /*
         * GEÇMİŞ KAYDI
         */

        item.innerHTML = `

            <div class="history-date">
                ${formatDate(record.update_date)}
            </div>

            <div class="history-stats">

                👷 ${record.workers || 0}

                • 🥚 ${record.eggs || 0}

                • 🐛 ${record.larvae || 0}

                • 🟤 ${record.pupae || 0}

                ${
                    record.temperature != null
                    ? " • 🌡️ "
                    + record.temperature
                    + "°C"
                    : ""
                }

                ${
                    record.humidity != null
                    ? " • 💧 "
                    + record.humidity
                    + "%"
                    : ""
                }

            </div>

            ${
                record.note
                ? `
                    <div class="history-note">
                        ${escapeHTML(record.note)}
                    </div>
                `
                : ""
            }

            ${photoHTML}

        `;

        container.appendChild(item);
    }
}


/* =====================================
   GRAFİK
===================================== */

function drawChart(
    canvas,
    data
) {

    const width =
        canvas.clientWidth;

    const height = 230;

    const dpr =
        window.devicePixelRatio
        || 1;


    canvas.width =
        width * dpr;

    canvas.height =
        height * dpr;


    const ctx =
        canvas.getContext(
            "2d"
        );


    ctx.scale(
        dpr,
        dpr
    );


    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    if (data.length < 2) {

        ctx.fillStyle =
            "#888";

        ctx.font =
            "13px Arial";

        ctx.fillText(
            "Grafik için en az 2 güncelleme gerekir.",
            15,
            35
        );

        return;

    }


    const padding = 30;

    const maxWorkers =
        Math.max(
            ...data.map(
                item =>
                    Number(
                        item.workers
                    ) || 0
            ),
            1
        );


    ctx.strokeStyle =
        "#ddd";

    ctx.lineWidth = 1;


    for (
        let i = 0;
        i < 4;
        i++
    ) {

        const y =
            padding
            +
            (
                height
                -
                padding * 2
            )
            *
            i
            /
            3;


        ctx.beginPath();

        ctx.moveTo(
            padding,
            y
        );

        ctx.lineTo(
            width - padding,
            y
        );

        ctx.stroke();

    }


    ctx.strokeStyle =
        "#222";

    ctx.lineWidth = 2;


    ctx.beginPath();


    data.forEach(
        (
            item,
            index
        ) => {

            const x =
                padding
                +
                (
                    width
                    -
                    padding * 2
                )
                *
                (
                    index
                    /
                    (
                        data.length - 1
                    )
                );


            const y =
                height
                -
                padding
                -
                (
                    (
                        Number(
                            item.workers
                        ) || 0
                    )
                    /
                    maxWorkers
                )
                *
                (
                    height
                    -
                    padding * 2
                );


            if (index === 0) {

                ctx.moveTo(
                    x,
                    y
                );

            }

            else {

                ctx.lineTo(
                    x,
                    y
                );

            }

        }
    );


    ctx.stroke();


    ctx.fillStyle =
        "#222";


    data.forEach(
        (
            item,
            index
        ) => {

            const x =
                padding
                +
                (
                    width
                    -
                    padding * 2
                )
                *
                (
                    index
                    /
                    (
                        data.length - 1
                    )
                );


            const y =
                height
                -
                padding
                -
                (
                    (
                        Number(
                            item.workers
                        ) || 0
                    )
                    /
                    maxWorkers
                )
                *
                (
                    height
                    -
                    padding * 2
                );


            ctx.beginPath();

            ctx.arc(
                x,
                y,
                4,
                0,
                Math.PI * 2
            );

            ctx.fill();

        }
    );

}

async function createUpdate(colonyId) {

    console.log("=== CREATE UPDATE BAŞLADI ===");
    console.log("Colony ID:", colonyId);
    console.log("Current User:", currentUser?.id);


    if (!currentUser) {

        alert("Oturum bulunamadı. Lütfen tekrar giriş yap.");

        return false;

    }


    if (!colonyId) {

        alert("Koloni ID bulunamadı.");

        console.error(
            "CREATE UPDATE: colonyId undefined/null"
        );

        return false;

    }


    /*
        GÜNCELLEMEYİ OLUŞTUR
    */

    const {
        data,
        error
    } =
    await supabaseClient
        .from("colony_updates")
        .insert({

            colony_id:
                colonyId,

            update_date:
                today(),

            workers:
                Number(
                    document
                        .getElementById("workers")
                        .value
                ) || 0,

            eggs:
                Number(
                    document
                        .getElementById("eggs")
                        .value
                ) || 0,

            larvae:
                Number(
                    document
                        .getElementById("larvae")
                        .value
                ) || 0,

            pupae:
                Number(
                    document
                        .getElementById("pupae")
                        .value
                ) || 0,

            temperature:
                document
                    .getElementById("temperature")
                    .value === ""
                    ? null
                    : Number(
                        document
                            .getElementById("temperature")
                            .value
                    ),

            humidity:
                document
                    .getElementById("humidity")
                    .value === ""
                    ? null
                    : Number(
                        document
                            .getElementById("humidity")
                            .value
                    ),

            note:
                document
                    .getElementById("note")
                    .value
                    .trim()
                    || null

        })
        .select()
        .single();


    console.log(
        "UPDATE INSERT SONUCU:",
        data
    );

    console.log(
        "UPDATE INSERT HATASI:",
        error
    );


    if (error) {

        console.error(
            "GÜNCELLEME OLUŞTURULAMADI:",
            error
        );

        alert(
            "Güncelleme oluşturulamadı:\n\n"
            +
            error.message
        );

        return false;

    }


    console.log(
        "GÜNCELLEME BAŞARIYLA OLUŞTURULDU:",
        data.id
    );


    /*
        FOTOĞRAFLAR
    */

    for (
        const file
        of selectedPhotos
    ) {

        console.log(
            "Fotoğraf yükleniyor:",
            file.name
        );


        /*
            BOYUT KONTROLÜ
        */

        if (
            file.size >
            5 * 1024 * 1024
        ) {

            alert(
                file.name
                +
                " 5 MB'dan büyük."
            );

            continue;

        }


        /*
            DOSYA UZANTISI
        */

        const extension =
            file.name
                .split(".")
                .pop()
                .toLowerCase();


        /*
            STORAGE PATH
        */

        const path =
            currentUser.id
            +
            "/"
            +
            colonyId
            +
            "/"
            +
            data.id
            +
            "-"
            +
            crypto.randomUUID()
            +
            "."
            +
            extension;


        console.log(
            "Storage path:",
            path
        );


        /*
            STORAGE'A YÜKLE
        */

        const upload =
            await supabaseClient
                .storage
                .from("colony-photos")
                .upload(
                    path,
                    file,
                    {
                        upsert: false,
                        contentType:
                            file.type
                    }
                );


        console.log(
            "STORAGE SONUCU:",
            upload
        );


        if (upload.error) {

            console.error(
                "STORAGE HATASI:",
                upload.error
            );

            alert(
                "Fotoğraf yüklenemedi:\n\n"
                +
                upload.error.message
            );

            continue;

        }


        /*
            PUBLIC URL
        */

        const {
            data: publicData
        } =
        supabaseClient
            .storage
            .from("colony-photos")
            .getPublicUrl(path);


        const publicURL =
            publicData.publicUrl;


        console.log(
            "Public URL:",
            publicURL
        );


        /*
            FOTOĞRAF TABLOSU
        */

        const {
            data: photoRecord,
            error: photoError
        } =
        await supabaseClient
            .from("colony_photos")
            .insert({

                update_id:
                    data.id,

                photo_url:
                    publicURL

            })
            .select()
            .single();


        console.log(
            "PHOTO INSERT SONUCU:",
            photoRecord
        );

        console.log(
            "PHOTO INSERT HATASI:",
            photoError
        );


        if (photoError) {

            console.error(
                "FOTOĞRAF VERİTABANI KAYIT HATASI:",
                photoError
            );

            alert(
                "Fotoğraf veritabanına kaydedilemedi:\n\n"
                +
                photoError.message
            );

            continue;

        }


        console.log(
            "FOTOĞRAF BAŞARIYLA KAYDEDİLDİ:",
            photoRecord.id
        );

    }


    /*
        FOTOĞRAFLARI TEMİZLE
    */

    selectedPhotos = [];


    /*
        MODALI KAPAT
    */

    closeModal();


    /*
        GÜNCEL KOLONİYİ TEKRAR ÇİZ
    */

    await renderColony();


    console.log(
        "=== CREATE UPDATE TAMAMLANDI ==="
    );


    return true;

}

                            record.humidity != null
                            ? " • 💧 "
                            + record.humidity
                            + "%"
                            : ""
                        }

                    </div>

                    ${
                        record.note
                        ?
                        `
                        <div class="history-note">
                            ${escapeHTML(
                                record.note
                            )}
                        </div>
                        `
                        :
                        ""
                    }

                    ${photoHTML}

                `;

                history.appendChild(item);

            });

    }


    /* GRAFİK */

    drawChart(
        document.getElementById(
            "sharedChart"
        ),
        updates
    );
}

/* =========================================================

========================================================= */

const originalRenderHistoryEdit =
    renderHistory;


/* =========================================================
   YENİ RENDER HISTORY
========================================================= */

renderHistory = async function(history) {

    await originalRenderHistoryEdit(history);

    const container =
        document.getElementById("history");

    if (!container) return;

    const items =
        container.querySelectorAll(
            ".history-item"
        );

    const reversedHistory =
        [...history].reverse();

    items.forEach(
        (item, index) => {

            const record =
                reversedHistory[index];

            if (!record) return;

            const row =
                document.createElement("div");

            row.className =
                "history-edit-row";

            const button =
                document.createElement("button");

            button.type =
                "button";

            button.className =
                "history-edit-button";

            button.textContent =
                "✏️ Düzenle";

            button.addEventListener(
                "click",
                function(event) {

                    event.stopPropagation();

                    openEditUpdate(
                        record.id
                    );

                }
            );

            row.appendChild(button);

            item.appendChild(row);

        }
    );

};


/* =========================================================
   DÜZENLEME MODALINI AÇ
========================================================= */

async function openEditUpdate(updateId) {

    const {
        data,
        error
    } =
    await supabaseClient
        .from("colony_updates")
        .select("*")
        .eq(
            "id",
            updateId
        )
        .limit(1);


    if (error) {

        console.error(
            "KAYIT ALMA HATASI:",
            error
        );

        alert(
            "Kayıt alınamadı:\n\n"
            +
            error.message
        );

        return;

    }


    /*
        .single() KULLANMIYORUZ.
        Böylece "Cannot coerce..." hatası olmaz.
    */

    if (
        !data ||
        data.length === 0
    ) {

        alert(
            "Düzenlenecek kayıt bulunamadı."
        );

        return;

    }


    const record =
        data[0];


    editingUpdateId =
        record.id;


    /* MODAL BAŞLIĞI */

    document
        .getElementById(
            "modalTitle"
        )
        .textContent =
        "Güncellemeyi Düzenle";


    /* KOLON BİLGİLERİNİ GİZLE */

    document
        .getElementById(
            "colonyNameGroup"
        )
        .classList
        .add("hidden");

    document
        .getElementById(
            "speciesGroup"
        )
        .classList
        .add("hidden");

    document
        .getElementById(
            "foundingGroup"
        )
        .classList
        .add("hidden");


    /* DEĞERLERİ FORMA DOLDUR */

    document
        .getElementById("workers")
        .value =
        record.workers ?? 0;

    document
        .getElementById("eggs")
        .value =
        record.eggs ?? 0;

    document
        .getElementById("larvae")
        .value =
        record.larvae ?? 0;

    document
        .getElementById("pupae")
        .value =
        record.pupae ?? 0;

    document
        .getElementById("temperature")
        .value =
        record.temperature ?? "";

    document
        .getElementById("humidity")
        .value =
        record.humidity ?? "";

    document
        .getElementById("note")
        .value =
        record.note ?? "";


    /* FOTOĞRAF SEÇİMİNİ TEMİZLE */

    selectedPhotos = [];

    document
        .getElementById("photos")
        .value = "";

    document
        .getElementById("preview")
        .innerHTML = "";


    /* BİLGİ MESAJI */

    let notice =
        document.getElementById(
            "editModeNotice"
        );


    if (!notice) {

        notice =
            document.createElement(
                "div"
            );

        notice.id =
            "editModeNotice";

        notice.style.background =
            "#eef6ff";

        notice.style.color =
            "#24527a";

        notice.style.padding =
            "10px 12px";

        notice.style.borderRadius =
            "12px";

        notice.style.marginBottom =
            "14px";

        notice.style.fontSize =
            "13px";


        document
            .getElementById(
                "colonyForm"
            )
            .prepend(
                notice
            );

    }


    notice.textContent =
        "✏️ Eski kaydı düzenliyorsun. Değişikliklerini yaptıktan sonra kaydet.";


    /* BUTON */

    const saveButton =
        document.querySelector(
            "#colonyForm button[type='submit']"
        );


    if (saveButton) {

        saveButton.textContent =
            "Değişiklikleri Kaydet";

    }


    openModal();

}


/* =========================================================
   DÜZENLEME MODUNU TEMİZLE
========================================================= */

function clearEditMode() {

    editingUpdateId =
        null;


    const notice =
        document.getElementById(
            "editModeNotice"
        );


    if (notice) {

        notice.remove();

    }


    const saveButton =
        document.querySelector(
            "#colonyForm button[type='submit']"
        );


    if (saveButton) {

        saveButton.textContent =
            "Kaydet";

    }

}


/* =========================================================
   FORM SUBMIT
========================================================= */

document
    .getElementById(
        "colonyForm"
    )
    .addEventListener(
        "submit",
        async function(event) {

            if (!editingUpdateId) {

                return;

            }


            event.preventDefault();

            event.stopImmediatePropagation();


            await updateExistingRecord(
                editingUpdateId
            );

        },
        true
    );


/* =========================================================
   MEVCUT KAYDI GÜNCELLE
========================================================= */

async function updateExistingRecord(
    updateId
) {

    if (!currentUser) {

        alert(
            "Oturum bulunamadı."
        );

        return;

    }


    const updateData = {

        workers:
            Number(
                document
                    .getElementById(
                        "workers"
                    )
                    .value
            ) || 0,

        eggs:
            Number(
                document
                    .getElementById(
                        "eggs"
                    )
                    .value
            ) || 0,

        larvae:
            Number(
                document
                    .getElementById(
                        "larvae"
                    )
                    .value
            ) || 0,

        pupae:
            Number(
                document
                    .getElementById(
                        "pupae"
                    )
                    .value
            ) || 0,

        temperature:
            document
                .getElementById(
                    "temperature"
                )
                .value === ""
                ? null
                : Number(
                    document
                        .getElementById(
                            "temperature"
                        )
                        .value
                ),

        humidity:
            document
                .getElementById(
                    "humidity"
                )
                .value === ""
                ? null
                : Number(
                    document
                        .getElementById(
                            "humidity"
                        )
                        .value
                ),

        note:
            document
                .getElementById(
                    "note"
                )
                .value
                .trim()
                || null

    };


    console.log(
        "=== KAYIT DÜZENLEME ==="
    );

    console.log(
        "Update ID:",
        updateId
    );

    console.log(
        "Yeni veriler:",
        updateData
    );


    /*
        DİKKAT:
        .select().single() YOK.
    */

    const {
        error
    } =
    await supabaseClient
        .from("colony_updates")
        .update(
            updateData
        )
        .eq(
            "id",
            updateId
        );


    if (error) {

        console.error(
            "GÜNCELLEME HATASI:",
            error
        );

        alert(
            "Kayıt güncellenemedi:\n\n"
            +
            error.message
        );

        return;

    }


    console.log(
        "KAYIT BAŞARIYLA GÜNCELLENDİ"
    );


    clearEditMode();


    document
        .getElementById(
            "modal"
        )
        .classList
        .remove("open");


    selectedPhotos = [];


    document
        .getElementById(
            "preview"
        )
        .innerHTML = "";


    document
        .getElementById(
            "photos"
        )
        .value = "";


    await renderColony();


    alert(
        "✓ Kayıt başarıyla güncellendi."
    );

}
